project_id = "civiclens"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

[auth.email]
# Renamed from the former top-level `auth.enable_email_confirmations`, which
# current CLI versions reject outright ("'auth' has invalid keys").
# This setting applies to `supabase start` only; the hosted project's own
# confirmation setting is managed in the dashboard. `src/main.tsx` handles both
# cases, treating a null session after sign-up as "check your email".
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.scan-project]
verify_jwt = true

[functions.dpwh-projects]
verify_jwt = false

[functions.report-preview]
verify_jwt = false
